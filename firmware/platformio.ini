; inkfetch firmware.
;
;   pio run -e seeed-ee02 -t upload    build and flash a display profile
;   pio test -e native                 hardware-free tests of lib/inkfetch_core
;
; Adding a display: see "Adding a display" in the README.

[inkfetch]
version = 0.1.0

[env]
lib_deps =
    bitbank2/PNGdec@1.1.6
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
    ; Room for one decoded row of up to 4095 px at 8 bpp.
    -DPNG_MAX_BUFFERED_PIXELS=8194
build_unflags = -std=gnu++11

; Common base for ESP32 boards (arduino-esp32 3.x through pioarduino).
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@2.0.17
build_flags =
    ${env.build_flags}
    -DINKFETCH_VERSION=\"${inkfetch.version}\"
    -DINKFETCH_ENV=\"${PIOENV}\"
    -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra
test_ignore = *

; Seeed Studio XIAO ePaper Display Board EE02: XIAO ESP32-S3 Plus + 13.3" E Ink
; Spectra 6 (1200x1600, T133A01).
[env:seeed-ee02]
extends = esp32
board = seeed_xiao_esp32s3
; 16 MB flash (two OTA app slots), 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${esp32.lib_deps}
    https://github.com/Seeed-Studio/Seeed_GFX2.git#aac551d85c7adc59db13db3faffdd2be7dfb31bc
build_flags =
    ${esp32.build_flags}
    -DBOARD_HAS_PSRAM
    ; GPIO43 (UART0 TX) powers the panel: logs go over USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DINKFETCH_PROFILE_SEEED_EE02
build_src_filter = +<*> -<display/> +<display/seeed_ee02.cpp>

[env:native]
platform = native
test_framework = unity
; PNGdec ships Arduino metadata but builds fine without a framework.
lib_compat_mode = off
build_flags =
    ${env.build_flags}
    ; PNGdec's portable (non-Arduino) path.
    -D__LINUX__
    -DINKFETCH_FIXTURES=\"${PROJECT_DIR}/../fixtures\"
    -Wall
    -Wextra
