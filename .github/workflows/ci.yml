name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  firmware-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [seeed-ee02]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.profile }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = ${GITHUB_REF_NAME#v}/" platformio.ini
      - run: pio run -e ${{ matrix.profile }}
      - run: cp .pio/build/${{ matrix.profile }}/firmware.bin inkfetch-${{ matrix.profile }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: firmware/inkfetch-${{ matrix.profile }}.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tools, firmware-native, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./tools
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: OTA manifests
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          for bin in dist/inkfetch-*.bin; do
            profile=$(basename "$bin" .bin); profile=${profile#inkfetch-}
            inkfetch manifest "$bin" --env "$profile" --version "$GITHUB_REF_NAME" \
              --url "$base/$(basename "$bin")" > "dist/$profile.json"
          done
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
